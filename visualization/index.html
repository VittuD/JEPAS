<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JEPA Experiment Browser</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f4f1ea; color: #20231f; }
    body { margin: 0; }
    header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 1rem; padding: 1rem 1.5rem; background: rgba(244, 241, 234, .96); border-bottom: 1px solid #cbc5b8; backdrop-filter: blur(8px); }
    h1 { margin: 0; font: 650 1.15rem/1.2 Georgia, serif; }
    select { max-width: 34rem; padding: .5rem .75rem; border: 1px solid #989080; border-radius: .4rem; background: #fff; }
    main { padding: 1.5rem; overflow: auto; }
    table { border-collapse: separate; border-spacing: .75rem; min-width: 100%; }
    th { text-align: left; vertical-align: top; font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; color: #665f53; }
    th[scope="row"] { min-width: 9rem; }
    td { min-width: 28rem; max-width: 44rem; padding: .75rem; vertical-align: top; background: #fff; border: 1px solid #d8d2c7; border-radius: .5rem; box-shadow: 0 2px 8px rgba(50, 42, 28, .06); }
    img, video { display: block; width: 100%; height: auto; background: #eee; }
    .media { display: grid; gap: .75rem; }
    .full { font-size: .8rem; color: #395d50; }
    details { margin-top: .75rem; font-size: .8rem; }
    pre { max-height: 18rem; overflow: auto; padding: .75rem; background: #f7f6f2; white-space: pre-wrap; overflow-wrap: anywhere; }
    .empty { padding: 3rem; color: #665f53; text-align: center; }
  </style>
</head>
<body>
  <header><h1>JEPA Experiment Browser</h1><select id="experiment" aria-label="Experiment"></select></header>
  <main id="browser"><p class="empty">Loading experiments…</p></main>
  <script>
    const selector = document.querySelector('#experiment');
    const browser = document.querySelector('#browser');
    const escapeHtml = value => String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));

    function render(experiment) {
      const cells = new Map(experiment.cells.map(cell => [`${cell.input}\u0000${cell.model}`, cell]));
      let html = '<table><thead><tr><th>Input / model</th>';
      html += experiment.columns.map(model => `<th scope="col">${escapeHtml(model)}</th>`).join('') + '</tr></thead><tbody>';
      for (const input of experiment.rows) {
        html += `<tr><th scope="row">${escapeHtml(input)}</th>`;
        for (const model of experiment.columns) {
          const cell = cells.get(`${input}\u0000${model}`);
          if (!cell) { html += '<td></td>'; continue; }
          const video = cell.video ? `<video controls preload="metadata" src="${cell.video}"></video>` : '';
          html += `<td><div class="media"><a href="${cell.image}" target="_blank"><img loading="lazy" src="${cell.image}" alt="${escapeHtml(input)} with ${escapeHtml(model)}"></a>${video}</div><a class="full" href="${cell.image}" target="_blank">Open full-resolution image</a><details><summary>Metadata</summary><pre>${escapeHtml(JSON.stringify(cell.metadata, null, 2))}</pre></details></td>`;
        }
        html += '</tr>';
      }
      browser.innerHTML = html + '</tbody></table>';
    }

    fetch('/api/experiments').then(response => response.json()).then(experiments => {
      if (!experiments.length) {
        selector.hidden = true;
        browser.innerHTML = '<p class="empty">No visualized new-schema experiments found.</p>';
        return;
      }
      selector.innerHTML = experiments.map((experiment, index) => `<option value="${index}">${escapeHtml(experiment.name)}</option>`).join('');
      selector.addEventListener('change', () => render(experiments[Number(selector.value)]));
      render(experiments[0]);
    }).catch(error => { browser.innerHTML = `<p class="empty">Could not load experiments: ${escapeHtml(error)}</p>`; });
  </script>
</body>
</html>
